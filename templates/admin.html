<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin-Panel</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
    margin: 0;
    padding: 1rem;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { text-align: center; margin: 1rem 0; }
  .login-box {
    max-width: 400px;
    margin: 3rem auto;
    background: #1e293b;
    border-radius: 16px;
    padding: 2rem;
    border: 1px solid #334155;
  }
  .login-box input {
    width: 100%;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 0.8rem;
    font-size: 1rem;
    margin: 0.5rem 0;
    font-family: inherit;
  }
  .login-box input:focus { outline: none; border-color: #3b82f6; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 0.7rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: #16a34a; color: white; }
  .btn-success:hover { background: #15803d; }
  .btn-small { padding: 0.35rem 0.7rem; font-size: 0.85rem; border-radius: 6px; }
  .stats {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 0.8rem 1.2rem;
    flex: 1;
    min-width: 180px;
  }
  .stat-card .label {
    font-size: 0.8rem;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 600;
  }
  .stat-card .value {
    font-size: 1.5rem;
    font-weight: 800;
    color: #4ade80;
    font-variant-numeric: tabular-nums;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }
  th, td {
    padding: 0.7rem 0.8rem;
    text-align: left;
    border-bottom: 1px solid #334155;
    font-size: 0.9rem;
  }
  th {
    background: #0f172a;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: #94a3b8;
  }
  tr:hover { background: #0f172a; }
  td input.balance-input {
    width: 90px;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    font-family: inherit;
    font-size: 0.9rem;
  }
  td input.balance-input:focus { outline: none; border-color: #3b82f6; }
  td.actions { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.account { background: #14532d; color: #bbf7d0; }
  .badge.guest { background: #334155; color: #cbd5e1; }
  .section-title {
    margin: 1.5rem 0 0.8rem;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .search-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    align-items: center;
  }
  .search-row input {
    flex: 1;
    background: #1e293b;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    font-family: inherit;
  }
  .search-row input:focus { outline: none; border-color: #3b82f6; }
  .empty {
    text-align: center;
    color: #94a3b8;
    padding: 2rem;
    background: #1e293b;
    border-radius: 12px;
  }
</style>
</head>
<body>

<div class="container">

  <div id="loginSection" class="login-box" style="display:none;">
    <h1>🔐 Admin-Login</h1>
    <input type="password" id="adminPassword" placeholder="Admin-Passwort">
    <div style="color:#f87171; min-height:1.2rem; text-align:center; font-size:0.9rem;" id="loginError"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="doAdminLogin()">Einloggen</button>
  </div>

  <div id="panelSection" style="display:none;">
    <h1>🛠️ Admin-Panel</h1>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Accounts</div>
        <div class="value" id="statAccounts">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Gäste</div>
        <div class="value" id="statGuests">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Account-Guthaben</div>
        <div class="value" id="statAccountBalance">0,00 €</div>
      </div>
      <div class="stat-card">
        <div class="label">Gäste-Guthaben</div>
        <div class="value" id="statGuestBalance">0,00 €</div>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Suche nach Nutzername…" oninput="renderTables()">
      <button class="btn btn-primary" onclick="loadData()">🔄 Neu laden</button>
      <button class="btn btn-danger" onclick="doAdminLogout()">Ausloggen</button>
    </div>

    <div class="section-title">👤 Accounts</div>
    <div id="accountsTable"></div>

    <div class="section-title">🎮 Gäste</div>
    <div id="guestsTable"></div>
  </div>

</div>

<script>
let data = { accounts: [], guests: [], totals: {} };

async function checkAdmin() {
  try {
    const res = await fetch('/api/admin/check');
    const d = await res.json();
    if (d.is_admin) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('panelSection').style.display = 'block';
      await loadData();
    } else {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('panelSection').style.display = 'none';
    }
  } catch (e) {
    document.getElementById('loginSection').style.display = 'block';
  }
}

async function doAdminLogin() {
  const pw = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw})
    });
    const d = await res.json();
    if (!res.ok) { errEl.textContent = d.error; return; }
    document.getElementById('adminPassword').value = '';
    checkAdmin();
  } catch (e) {
    errEl.textContent = 'Netzwerkfehler.';
  }
}

async function doAdminLogout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  checkAdmin();
}

async function loadData() {
  try {
    const res = await fetch('/api/admin/data');
    if (res.status === 401) { checkAdmin(); return; }
    data = await res.json();
    renderStats();
    renderTables();
  } catch (e) {
    console.error(e);
  }
}

function renderStats() {
  document.getElementById('statAccounts').textContent = data.totals.account_count || 0;
  document.getElementById('statGuests').textContent = data.totals.guest_count || 0;
  document.getElementById('statAccountBalance').textContent =
    (data.totals.account_balance || 0).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  document.getElementById('statGuestBalance').textContent =
    (data.totals.guest_balance || 0).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderTables() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();

  const accContainer = document.getElementById('accountsTable');
  const accFiltered = data.accounts.filter(a =>
    !search || a.name.toLowerCase().includes(search) || (a.email || '').toLowerCase().includes(search)
  );
  if (!accFiltered.length) {
    accContainer.innerHTML = '<div class="empty">Keine Accounts.</div>';
  } else {
    accContainer.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Nutzername</th>
            <th>E-Mail</th>
            <th>Guthaben</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody>
          ${accFiltered.map(a => `
            <tr>
              <td><span class="badge account">Account</span> ${escapeHtml(a.name)}</td>
              <td>${escapeHtml(a.email || '-')}</td>
              <td>
                <input type="number" step="0.01" class="balance-input" id="bal-acc-${a.id}" value="${a.balance}">
              </td>
              <td class="actions">
                <button class="btn btn-success btn-small" onclick="saveBalance('account', ${a.id})">💾 Speichern</button>
                <button class="btn btn-danger btn-small" onclick="setZero('account', ${a.id})">⛔ Auf 0</button>
                <button class="btn btn-danger btn-small" onclick="deleteItem('account', ${a.id})">🗑️ Löschen</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  const guestContainer = document.getElementById('guestsTable');
  const guestFiltered = data.guests.filter(g =>
    !search || (g.name || '').toLowerCase().includes(search)
  );
  if (!guestFiltered.length) {
    guestContainer.innerHTML = '<div class="empty">Keine Gäste.</div>';
  } else {
    guestContainer.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Zuletzt gesehen</th>
            <th>Guthaben</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody>
          ${guestFiltered.map(g => `
            <tr>
              <td><span class="badge guest">Gast</span> <code style="font-size:0.75rem;">${escapeHtml(g.id.slice(0,10))}…</code></td>
              <td>${escapeHtml((g.last_seen || '').slice(0,16).replace('T',' '))}</td>
              <td>
                <input type="number" step="0.01" class="balance-input" id="bal-guest-${g.id}" value="${g.balance}">
              </td>
              <td class="actions">
                <button class="btn btn-success btn-small" onclick="saveBalance('guest', '${g.id}')">💾 Speichern</button>
                <button class="btn btn-danger btn-small" onclick="setZero('guest', '${g.id}')">⛔ Auf 0</button>
                <button class="btn btn-danger btn-small" onclick="deleteItem('guest', '${g.id}')">🗑️ Löschen</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }
}

async function saveBalance(type, id) {
  const inputId = type === 'account' ? `bal-acc-${id}` : `bal-guest-${id}`;
  const value = parseFloat(document.getElementById(inputId).value);
  if (isNaN(value)) return;
  await fetch('/api/admin/set_balance', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type, id, balance: value})
  });
  await loadData();
}

async function setZero(type, id) {
  if (!confirm('Guthaben wirklich auf 0 setzen?')) return;
  await fetch('/api/admin/set_balance', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type, id, balance: 0})
  });
  await loadData();
}

async function deleteItem(type, id) {
  if (!confirm('Wirklich löschen?')) return;
  await fetch('/api/admin/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type, id})
  });
  await loadData();
}

checkAdmin();
</script>
</body>
</html>
