<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinflip · Glücksrad · Roulette</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0b1220 70%);
    color: #e2e8f0;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #1e293b;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.7rem 1rem 0.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .player-info {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: #0f172a;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid #334155;
  }
  .player-name {
    font-weight: 700;
    color: #60a5fa;
    cursor: pointer;
  }
  .player-name:hover { text-decoration: underline; }
  .balance {
    font-weight: 800;
    color: #4ade80;
    font-variant-numeric: tabular-nums;
  }
  .balance.negative { color: #f87171; }
  .player-actions {
    display: flex;
    gap: 0.4rem;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid #334155;
    color: #cbd5e1;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: #1e293b; border-color: #64748b; }
  nav {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 0.5rem;
    padding: 0 1rem 0.7rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  nav button {
    background: transparent;
    border: 1px solid #334155;
    color: #cbd5e1;
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  nav button:hover { background: #1e293b; }
  nav button.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
  }
  main {
    width: 100%;
    max-width: 720px;
    padding: 2rem 1rem 4rem;
  }
  .page { display: none; }
  .page.active { display: block; animation: fade 0.3s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  h1 { text-align: center; margin: 0.5rem 0 1.5rem; font-size: 1.6rem; }

  /* ---- Einsatz ---- */
  .bet-amount-section {
    width: 100%;
    max-width: 480px;
    background: #1e293b;
    border-radius: 14px;
    padding: 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .bet-amount-section .bet-label {
    font-size: 0.8rem;
    color: #94a3b8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .quick-bet-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .quick-bet {
    flex: 1;
    min-width: 60px;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 0.55rem 0.6rem;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-bet:hover:not(:disabled) { border-color: #64748b; }
  .quick-bet.selected {
    border-color: #4ade80;
    background: #14532d;
    color: white;
  }
  .quick-bet:disabled { opacity: 0.4; cursor: not-allowed; }
  .custom-bet-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .custom-bet-row input {
    flex: 1;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 0.55rem 0.9rem;
    font-size: 1rem;
    font-family: inherit;
  }
  .custom-bet-row input:focus { outline: none; border-color: #4ade80; }
  .custom-bet-row button {
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 0.55rem 1rem;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .custom-bet-row button:hover { border-color: #4ade80; }

  /* ---- Coin ---- */
  .coin-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .coin-wrapper {
    perspective: 1200px;
    height: 220px;
    width: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin {
    width: 180px;
    height: 180px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 2.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    will-change: transform;
  }
  .coin-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }
  .coin .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 800;
    backface-visibility: hidden;
    box-shadow:
      inset 0 0 0 6px rgba(255,255,255,0.25),
      inset 0 0 30px rgba(0,0,0,0.25),
      0 12px 30px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .coin .face::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 2px dashed rgba(0,0,0,0.15);
  }
  .coin .kopf {
    background: radial-gradient(circle at 30% 25%, #fef3c7, #f59e0b 55%, #b45309 100%);
    color: #78350f;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .coin .zahl {
    background: radial-gradient(circle at 30% 25%, #f8fafc, #cbd5e1 55%, #64748b 100%);
    color: #1e293b;
    transform: rotateY(180deg);
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .coin .edge {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(90deg,
      #92400e 0%, #fbbf24 20%, #b45309 40%,
      #fcd34d 60%, #92400e 80%, #fbbf24 100%);
    transform: translateZ(-10px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.55);
  }
  .coin.flipping .face::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(120deg,
      transparent 30%, rgba(255,255,255,0.7) 50%, transparent 70%);
    animation: shine 0.4s linear infinite;
  }
  @keyframes shine {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }
  .coin.settle { animation: settle 0.4s ease-out; }
  @keyframes settle {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .choice-row {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .choice-btn {
    background: #1e293b;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 0.7rem 1.6rem;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 110px;
  }
  .choice-btn:hover:not(:disabled) { border-color: #64748b; }
  .choice-btn.selected {
    border-color: #3b82f6;
    background: #1d4ed8;
    color: white;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
  }
  .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .flip-btn {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    border: none;
    padding: 0.85rem 2.2rem;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    transition: transform 0.1s;
  }
  .flip-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .choice-display {
    font-size: 1.05rem;
    color: #94a3b8;
    min-height: 1.5rem;
  }
  .choice-display b { color: #60a5fa; }
  .result-box {
    text-align: center;
    min-height: 2rem;
    font-size: 1.05rem;
  }
  .win { color: #4ade80; font-weight: 700; }
  .lose { color: #f87171; font-weight: 700; }

  /* ---- Wheel ---- */
  .wheel-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .wheel-container {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .wheel-pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 26px solid #f87171;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
    z-index: 2;
  }
  .wheel-svg {
    width: 100%;
    height: 100%;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.16, 1);
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
  }
  .wheel-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f8fafc, #64748b);
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .spin-btn {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: white;
    border: none;
    padding: 0.85rem 2.2rem;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    transition: transform 0.1s;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  textarea {
    width: 100%;
    min-height: 110px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    padding: 0.7rem;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  .hint { font-size: 0.85rem; color: #94a3b8; margin: 0.4rem 0; }

  /* ---- Roulette ---- */
  .roulette-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .roulette-display {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 1.2rem;
    text-align: center;
  }
  .roulette-number {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1;
    margin: 0.3rem 0 0.5rem;
    transition: color 0.3s, transform 0.2s;
    color: #94a3b8;
    display: inline-block;
    min-width: 1.6em;
  }
  .roulette-number.rolling { animation: pulse 0.15s linear infinite alternate; }
  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }
  .roulette-number.red { color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.5); }
  .roulette-number.black { color: #e2e8f0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
  .roulette-number.green { color: #22c55e; text-shadow: 0 0 20px rgba(34,197,94,0.6); }
  .roulette-color-badge {
    display: inline-block;
    padding: 0.25rem 0.9rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #334155;
    color: #94a3b8;
  }
  .roulette-color-badge.red { background: #7f1d1d; color: #fecaca; }
  .roulette-color-badge.black { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; }
  .roulette-color-badge.green { background: #14532d; color: #bbf7d0; }
  .roulette-bet-section {
    width: 100%;
    max-width: 460px;
    background: #1e293b;
    border-radius: 14px;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .bet-label {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 0.4rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .bet-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .bet-btn {
    flex: 1;
    min-width: 80px;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bet-btn:hover:not(:disabled) { border-color: #64748b; }
  .bet-btn.selected {
    border-color: #3b82f6;
    background: #1d4ed8;
    color: white;
  }
  .bet-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .bet-btn.red-btn.selected { background: #dc2626; border-color: #dc2626; }
  .bet-btn.black-btn.selected { background: #0f172a; border-color: #e2e8f0; color: white; }
  .number-input-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .number-input-row input {
    flex: 1;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    font-family: inherit;
  }
  .number-input-row input:focus { outline: none; border-color: #3b82f6; }

  /* ---- Modal ---- */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #1e293b;
    border-radius: 16px;
    padding: 1.5rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    border: 1px solid #334155;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin: 0 0 1rem; }
  .modal .form-row {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }
  .modal .form-row label {
    font-size: 0.85rem;
    color: #94a3b8;
    font-weight: 600;
  }
  .modal .form-row input {
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 0.65rem 0.9rem;
    font-size: 1rem;
    font-family: inherit;
  }
  .modal .form-row input:focus { outline: none; border-color: #3b82f6; }
  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 0.5rem;
  }
  .modal-actions button {
    padding: 0.6rem 1.2rem;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }

  .player-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin: 0.8rem 0;
    max-height: 240px;
    overflow-y: auto;
  }
  .player-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .player-item:hover { border-color: #64748b; }
  .player-item.current { border-color: #3b82f6; background: #1d4ed8; }
  .player-item .info { display: flex; flex-direction: column; }
  .player-item .name { font-weight: 700; }
  .player-item .bal { font-size: 0.85rem; color: #94a3b8; }
  .player-item.current .bal { color: #cbd5e1; }
  .player-item .delete {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.3rem;
  }
  .player-item .delete:hover { color: #f87171; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-height: 320px;
    overflow-y: auto;
    margin-top: 0.6rem;
  }
  .history-item {
    background: #0f172a;
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .history-item .amount.win { color: #4ade80; }
  .history-item .amount.lose { color: #f87171; }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="player-info">
      <span class="player-name" onclick="openPlayersModal()" id="currentPlayerName">Gast</span>
      <span class="balance" id="balanceDisplay">100,00 €</span>
      <div class="player-actions">
        <button class="icon-btn" title="Spieler wechseln" onclick="openPlayersModal()">👥</button>
        <button class="icon-btn" title="Verlauf" onclick="openHistoryModal()">📜</button>
      </div>
    </div>
  </div>
  <nav>
    <button id="nav-coin" class="active" onclick="showPage('coin')">🪙 Coinflip</button>
    <button id="nav-wheel" onclick="showPage('wheel')">🎡 Glücksrad</button>
    <button id="nav-roulette" onclick="showPage('roulette')">🎰 Roulette</button>
  </nav>
</header>

<main>

  <!-- ===== COIN PAGE ===== -->
  <section id="page-coin" class="page active">
    <h1>Coinflip</h1>
    <div class="coin-stage">

      <div class="bet-amount-section">
        <div class="bet-label">Einsatz wählen</div>
        <div class="quick-bet-row" id="coinQuickBets">
          <button class="quick-bet" data-amount="1" onclick="setCoinBet(1, this)">1 €</button>
          <button class="quick-bet" data-amount="2" onclick="setCoinBet(2, this)">2 €</button>
          <button class="quick-bet" data-amount="5" onclick="setCoinBet(5, this)">5 €</button>
          <button class="quick-bet" data-amount="10" onclick="setCoinBet(10, this)">10 €</button>
          <button class="quick-bet" data-amount="25" onclick="setCoinBet(25, this)">25 €</button>
        </div>
        <div class="custom-bet-row">
          <input type="number" id="coinCustomBet" placeholder="Anderer Betrag" min="0.01" step="0.01">
          <button onclick="applyCoinCustom()">OK</button>
        </div>
      </div>

      <div class="choice-display" id="choiceDisplay">
        Wähle <b>Kopf</b> oder <b>Zahl</b>
      </div>

      <div class="coin-wrapper">
        <div class="coin" id="coin">
          <div class="edge"></div>
          <div class="coin-inner">
            <div class="face kopf">K</div>
            <div class="face zahl">Z</div>
          </div>
        </div>
      </div>

      <div class="choice-row">
        <button class="choice-btn" id="btn-kopf" onclick="pickChoice('kopf')">Kopf</button>
        <button class="choice-btn" id="btn-zahl" onclick="pickChoice('zahl')">Zahl</button>
      </div>

      <button class="flip-btn" id="flipBtn" onclick="doFlip()" disabled>Flip!</button>
      <div class="result-box" id="coinResult"></div>
    </div>
  </section>

  <!-- ===== WHEEL PAGE ===== -->
  <section id="page-wheel" class="page">
    <h1>Glücksrad</h1>
    <div class="wheel-stage">
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 200 200"></svg>
        <div class="wheel-hub"></div>
      </div>
      <div class="result-box" id="wheelResult"></div>
      <button class="spin-btn" id="spinBtn" onclick="doSpin()">Drehen!</button>
      <div style="width: 100%; max-width: 480px;">
        <p class="hint">Eine Option pro Zeile (mind. 2, max. 12):</p>
        <textarea id="wheelOptions">Pizza
Burger
Sushi
Pasta
Salat
Curry</textarea>
      </div>
    </div>
  </section>

  <!-- ===== ROULETTE PAGE ===== -->
  <section id="page-roulette" class="page">
    <h1>Roulette</h1>
    <div class="roulette-stage">

      <div class="bet-amount-section">
        <div class="bet-label">Einsatz wählen</div>
        <div class="quick-bet-row" id="rouletteQuickBets">
          <button class="quick-bet" data-amount="1" onclick="setRouletteBet(1, this)">1 €</button>
          <button class="quick-bet" data-amount="2" onclick="setRouletteBet(2, this)">2 €</button>
