<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinflip · Glücksrad · Roulette</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0b1220 70%);
    color: #e2e8f0;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #1e293b;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 0.5rem;
    padding: 0.8rem 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  nav button {
    background: transparent;
    border: 1px solid #334155;
    color: #cbd5e1;
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  nav button:hover { background: #1e293b; }
  nav button.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
  }
  main {
    width: 100%;
    max-width: 720px;
    padding: 2rem 1rem 4rem;
  }
  .page { display: none; }
  .page.active { display: block; animation: fade 0.3s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  h1 { text-align: center; margin: 0.5rem 0 1.5rem; font-size: 1.6rem; }

  /* ================= COIN ================= */
  .coin-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .coin-wrapper {
    perspective: 1200px;
    height: 220px;
    width: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin {
    width: 180px;
    height: 180px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 2.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    will-change: transform;
  }
  .coin-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }
  .coin .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 800;
    backface-visibility: hidden;
    box-shadow:
      inset 0 0 0 6px rgba(255,255,255,0.25),
      inset 0 0 30px rgba(0,0,0,0.25),
      0 12px 30px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .coin .face::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 2px dashed rgba(0,0,0,0.15);
  }
  .coin .kopf {
    background: radial-gradient(circle at 30% 25%, #fef3c7, #f59e0b 55%, #b45309 100%);
    color: #78350f;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .coin .zahl {
    background: radial-gradient(circle at 30% 25%, #f8fafc, #cbd5e1 55%, #64748b 100%);
    color: #1e293b;
    transform: rotateY(180deg);
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .coin .edge {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(90deg,
      #92400e 0%, #fbbf24 20%, #b45309 40%,
      #fcd34d 60%, #92400e 80%, #fbbf24 100%);
    transform: translateZ(-10px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.55);
  }
  .coin.flipping .face::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(120deg,
      transparent 30%, rgba(255,255,255,0.7) 50%, transparent 70%);
    animation: shine 0.4s linear infinite;
  }
  @keyframes shine {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }
  .coin.settle { animation: settle 0.4s ease-out; }
  @keyframes settle {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .choice-row {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .choice-btn {
    background: #1e293b;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 0.7rem 1.6rem;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 110px;
  }
  .choice-btn:hover:not(:disabled) { border-color: #64748b; }
  .choice-btn.selected {
    border-color: #3b82f6;
    background: #1d4ed8;
    color: white;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
  }
  .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .flip-btn {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    border: none;
    padding: 0.85rem 2.2rem;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    transition: transform 0.1s;
  }
  .flip-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .choice-display {
    font-size: 1.05rem;
    color: #94a3b8;
    min-height: 1.5rem;
  }
  .choice-display b { color: #60a5fa; }
  .result-box {
    text-align: center;
    min-height: 2rem;
    font-size: 1.1rem;
  }
  .win { color: #4ade80; font-weight: 700; }
  .lose { color: #f87171; font-weight: 700; }

  /* ================= WHEEL ================= */
  .wheel-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .wheel-container {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .wheel-pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 26px solid #f87171;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
    z-index: 2;
  }
  .wheel-svg {
    width: 100%;
    height: 100%;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.16, 1);
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
  }
  .wheel-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f8fafc, #64748b);
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .spin-btn {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: white;
    border: none;
    padding: 0.85rem 2.2rem;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    transition: transform 0.1s;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  textarea {
    width: 100%;
    min-height: 110px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    padding: 0.7rem;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  .hint { font-size: 0.85rem; color: #94a3b8; margin: 0.4rem 0; }

  /* ================= ROULETTE ================= */
  .roulette-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .roulette-display {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 1.2rem;
    text-align: center;
  }
  .roulette-number {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1;
    margin: 0.3rem 0 0.5rem;
    transition: color 0.3s, transform 0.2s;
    color: #94a3b8;
    display: inline-block;
    min-width: 1.6em;
  }
  .roulette-number.rolling { animation: pulse 0.15s linear infinite alternate; }
  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }
  .roulette-number.red { color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.5); }
  .roulette-number.black { color: #e2e8f0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
  .roulette-number.green { color: #22c55e; text-shadow: 0 0 20px rgba(34,197,94,0.6); }
  .roulette-color-badge {
    display: inline-block;
    padding: 0.25rem 0.9rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #334155;
    color: #94a3b8;
  }
  .roulette-color-badge.red { background: #7f1d1d; color: #fecaca; }
  .roulette-color-badge.black { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; }
  .roulette-color-badge.green { background: #14532d; color: #bbf7d0; }
  .roulette-bet-section {
    width: 100%;
    max-width: 460px;
    background: #1e293b;
    border-radius: 14px;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .bet-label {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 0.4rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .bet-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .bet-btn {
    flex: 1;
    min-width: 80px;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bet-btn:hover:not(:disabled) { border-color: #64748b; }
  .bet-btn.selected {
    border-color: #3b82f6;
    background: #1d4ed8;
    color: white;
  }
  .bet-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .bet-btn.red-btn.selected { background: #dc2626; border-color: #dc2626; }
  .bet-btn.black-btn.selected { background: #0f172a; border-color: #e2e8f0; color: white; }
  .number-input-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .number-input-row input {
    flex: 1;
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    font-family: inherit;
  }
  .number-input-row input:focus {
    outline: none;
    border-color: #3b82f6;
  }
</style>
</head>
<body>

<header>
  <nav>
    <button id="nav-coin" class="active" onclick="showPage('coin')">🪙 Coinflip</button>
    <button id="nav-wheel" onclick="showPage('wheel')">🎡 Glücksrad</button>
    <button id="nav-roulette" onclick="showPage('roulette')">🎰 Roulette</button>
  </nav>
</header>

<main>

  <!-- ===== COIN PAGE ===== -->
  <section id="page-coin" class="page active">
    <h1>Coinflip</h1>
    <div class="coin-stage">
      <div class="choice-display" id="choiceDisplay">
        Wähle <b>Kopf</b> oder <b>Zahl</b>
      </div>
      <div class="coin-wrapper">
        <div class="coin" id="coin">
          <div class="edge"></div>
          <div class="coin-inner">
            <div class="face kopf">K</div>
            <div class="face zahl">Z</div>
          </div>
        </div>
      </div>
      <div class="choice-row">
        <button class="choice-btn" id="btn-kopf" onclick="pickChoice('kopf')">Kopf</button>
        <button class="choice-btn" id="btn-zahl" onclick="pickChoice('zahl')">Zahl</button>
      </div>
      <button class="flip-btn" id="flipBtn" onclick="doFlip()" disabled>Flip!</button>
      <div class="result-box" id="coinResult"></div>
    </div>
  </section>

  <!-- ===== WHEEL PAGE ===== -->
  <section id="page-wheel" class="page">
    <h1>Glücksrad</h1>
    <div class="wheel-stage">
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 200 200"></svg>
        <div class="wheel-hub"></div>
      </div>
      <div class="result-box" id="wheelResult"></div>
      <button class="spin-btn" id="spinBtn" onclick="doSpin()">Drehen!</button>
      <div style="width: 100%; max-width: 480px;">
        <p class="hint">Eine Option pro Zeile (mind. 2, max. 12):</p>
        <textarea id="wheelOptions">Pizza
Burger
Sushi
Pasta
Salat
Curry</textarea>
      </div>
    </div>
  </section>

  <!-- ===== ROULETTE PAGE ===== -->
  <section id="page-roulette" class="page">
    <h1>Roulette</h1>
    <div class="roulette-stage">

      <div class="roulette-display">
        <div class="roulette-color-badge" id="rouletteBadge">Bereit</div>
        <div class="roulette-number" id="rouletteNumber">–</div>
        <div class="hint" id="rouletteHint">Wähle deine Wette unten</div>
      </div>

      <div class="roulette-bet-section">
        <div>
          <div class="bet-label">Farbe (1:1)</div>
          <div class="bet-row">
            <button class="bet-btn red-btn" data-bet="color" data-value="red">🔴 Rot</button>
            <button class="bet-btn black-btn" data-bet="color" data-value="black">⚫ Schwarz</button>
          </div>
        </div>

        <div>
          <div class="bet-label">Gerade / Ungerade (1:1)</div>
          <div class="bet-row">
            <button class="bet-btn" data-bet="parity" data-value="even">Gerade</button>
            <button class="bet-btn" data-bet="parity" data-value="odd">Ungerade</button>
          </div>
        </div>

        <div>
          <div class="bet-label">Bereich (1:1)</div>
          <div class="bet-row">
            <button class="bet-btn" data-bet="range" data-value="low">1–18</button>
            <button class="bet-btn" data-bet="range" data-value="high">19–36</button>
          </div>
        </div>

        <div>
          <div class="bet-label">Dutzend (2:1)</div>
          <div class="bet-row">
            <button class="bet-btn" data-bet="dozen" data-value="1">1–12</button>
            <button class="bet-btn" data-bet="dozen" data-value="2">13–24</button>
            <button class="bet-btn" data-bet="dozen" data-value="3">25–36</button>
          </div>
        </div>

        <div>
          <div class="bet-label">Direkte Zahl (35:1)</div>
          <div class="number-input-row">
            <input type="number" id="rouletteNumberInput" min="0" max="36" placeholder="0–36">
            <button class="bet-btn" id="numberBetBtn" data-bet="number" style="flex:0 0 auto; padding:0.6rem 1.2rem;">Wählen</button>
          </div>
        </div>
      </div>

      <button class="spin-btn" id="rouletteSpinBtn" onclick="doRouletteSpin()" disabled>Drehen!</button>
      <div class="result-box" id="rouletteResult"></div>
    </div>
  </section>

</main>

<script>
/* ============ Navigation ============ */
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'wheel') renderWheel();
}

/* ============ Coinflip ============ */
let chosen = null;
let flipping = false;
let currentRotation = 0;

function pickChoice(c) {
  if (flipping) return;
  chosen = c;
  document.getElementById('btn-kopf').classList.toggle('selected', c === 'kopf');
  document.getElementById('btn-zahl').classList.toggle('selected', c === 'zahl');
  const label = c === 'kopf' ? 'Kopf' : 'Zahl';
  document.getElementById('choiceDisplay').innerHTML = `Deine Wahl: <b>${label}</b>`;
  document.getElementById('flipBtn').disabled = false;
  document.getElementById('coinResult').textContent = '';
}

async function doFlip() {
  if (!chosen || flipping) return;
  flipping = true;

  const coin = document.getElementById('coin');
  const flipBtn = document.getElementById('flipBtn');
  const btnKopf = document.getElementById('btn-kopf');
  const btnZahl = document.getElementById('btn-zahl');
  const resultEl = document.getElementById('coinResult');

  flipBtn.disabled = true;
  btnKopf.disabled = true;
  btnZahl.disabled = true;
  resultEl.textContent = '';

  const res = await fetch('/api/coinflip', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({choice: chosen})
  });
  const data = await res.json();

  if (data.error) {
    resultEl.textContent = data.error;
    resetCoinControls();
    return;
  }

  const targetFace = data.result === 'kopf' ? 0 : 180;
  const normalized = ((currentRotation % 360) + 360) % 360;
  let delta = targetFace - normalized;
  if (delta < 0) delta += 360;

  const extraSpins = 6 * 360;
  currentRotation += extraSpins + delta;

  coin.classList.add('flipping');
  coin.classList.remove('settle');
  coin.style.transform = `rotateY(${currentRotation}deg)`;

  setTimeout(() => {
    coin.classList.remove('flipping');
    coin.classList.add('settle');

    const resultText = data.result === 'kopf' ? 'Kopf' : 'Zahl';
    const choiceText = data.choice === 'kopf' ? 'Kopf' : 'Zahl';

    resultEl.innerHTML =
      `Gewählt: <b>${choiceText}</b> — Gefallen: <b>${resultText}</b><br>` +
      (data.win
        ? '<span class="win">🎉 Gewonnen!</span>'
        : '<span class="lose">😢 Verloren!</span>');

    resetCoinControls();
  }, 2700);
}

function resetCoinControls() {
  flipping = false;
  document.getElementById('flipBtn').disabled = false;
  document.getElementById('btn-kopf').disabled = false;
  document.getElementById('btn-zahl').disabled = false;
}

/* ============ Glücksrad ============ */
const WHEEL_COLORS = [
  '#ef4444', '#f59e0b', '#10b981', '#3b82f6',
  '#8b5cf6', '#ec4899', '#14b8a6', '#f97316',
  '#84cc16', '#06b6d4', '#a855f7', '#eab308'
];

let wheelRotation = 0;
let spinning = false;

function getWheelOptions() {
  const raw = document.getElementById('wheelOptions').value;
  return raw.split('\n').map(s => s.trim()).filter(Boolean);
}

function renderWheel() {
  const options = getWheelOptions();
  const svg = document.getElementById('wheelSvg');
  svg.innerHTML = '';

  if (options.length < 2) {
    svg.innerHTML = '<circle cx="100" cy="100" r="95" fill="#1e293b" stroke="#334155" stroke-width="2"/>' +
      '<text x="100" y="105" text-anchor="middle" fill="#94a3b8" font-size="10">Mind. 2 Optionen</text>';
    return;
  }

  const n = options.length;
  const angle = 360 / n;
  const cx = 100, cy = 100, r = 95;

  function polar(angleDeg, radius) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
  }

  for (let i = 0; i < n; i++) {
    const start = i * angle;
    const end = start + angle;
    const [x1, y1] = polar(start, r);
    const [x2, y2] = polar(end, r);
    const largeArc = angle > 180 ? 1 : 0;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`);
    path.setAttribute('fill', WHEEL_COLORS[i % WHEEL_COLORS.length]);
    path.setAttribute('stroke', '#0f172a');
    path.setAttribute('stroke-width', '1');
    svg.appendChild(path);

    const mid = start + angle / 2;
    const [tx, ty] = polar(mid, r * 0.62);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', tx);
    text.setAttribute('y', ty);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('fill', 'white');
    text.setAttribute('font-size', n > 8 ? '7' : '9');
    text.setAttribute('font-weight', '700');
    text.setAttribute('transform', `rotate(${mid} ${tx} ${ty})`);
    let label = options[i];
    if (label.length > 12) label = label.slice(0, 11) + '…';
    text.textContent = label;
    svg.appendChild(text);
  }
}

async function doSpin() {
  if (spinning) return;
  const options = getWheelOptions();

  if (options.length < 2) {
    document.getElementById('wheelResult').textContent = '⚠️ Mindestens 2 Optionen!';
    return;
  }
  if (options.length > 12) {
    document.getElementById('wheelResult').textContent = '⚠️ Maximal 12 Optionen!';
    return;
  }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('wheelResult').textContent = '';

  const res = await fetch('/api/wheel', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({options})
  });
  const data = await res.json();

  if (data.error) {
    document.getElementById('wheelResult').textContent = '⚠️ ' + data.error;
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    return;
  }

  const n = options.length;
  const anglePer = 360 / n;
  const winnerIndex = data.index;

  const segmentMid = winnerIndex * anglePer + anglePer / 2;
  const extraSpins = 6 * 360;
  const currentNormalized = ((wheelRotation % 360) + 360) % 360;
  const desired = ((-segmentMid) % 360 + 360) % 360;
  let delta = desired - currentNormalized;
  if (delta < 0) delta += 360;

  wheelRotation += extraSpins + delta;

  const svg = document.getElementById('wheelSvg');
  svg.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.16, 1)';
  svg.style.transform = `rotate(${wheelRotation}deg)`;

  setTimeout(() => {
    document.getElementById('wheelResult').innerHTML =
      `🎯 Ergebnis: <b>${data.result}</b>`;
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
  }, 4100);
}

document.getElementById('wheelOptions').addEventListener('input', () => {
  if (document.getElementById('page-wheel').classList.contains('active')) {
    renderWheel();
  }
});

/* ============ Roulette ============ */
let rouletteBet = null;   // {type, value}
let rouletteSpinning = false;

function setupRouletteButtons() {
  document.querySelectorAll('.roulette-bet-section .bet-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (rouletteSpinning) return;

      const betType = btn.dataset.bet;
      const betValue = btn.dataset.value;

      // Direkte Zahl über Input
      if (betType === 'number') {
        const input = document.getElementById('rouletteNumberInput');
        const val = input.value.trim();
        if (val === '' || isNaN(val)) {
          input.focus();
          input.style.borderColor = '#ef4444';
          setTimeout(() => input.style.borderColor = '#334155', 800);
          return;
        }
        const num = parseInt(val, 10);
        if (num < 0 || num > 36) {
          input.style.borderColor = '#ef4444';
          setTimeout(() => input.style.borderColor = '#334155', 800);
          return;
        }
        rouletteBet = { type: 'number', value: String(num) };
      } else {
        rouletteBet = { type: betType, value: betValue };
      }

      // Alle markierten aufheben, nur den aktuellen markieren
      document.querySelectorAll('.roulette-bet-section .bet-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      document.getElementById('rouletteSpinBtn').disabled = false;
      document.getElementById('rouletteHint').textContent = 'Wette gesetzt – bereit zum Drehen!';
      document.getElementById('rouletteResult').textContent = '';
    });
  });
}

async function doRouletteSpin() {
  if (!rouletteBet || rouletteSpinning) return;

  rouletteSpinning = true;
  const spinBtn = document.getElementById('rouletteSpinBtn');
  const allBtns = document.querySelectorAll('.roulette-bet-section .bet-btn');
  const numberEl = document.getElementById('rouletteNumber');
  const badge = document.getElementById('rouletteBadge');
  const hint = document.getElementById('rouletteHint');
  const resultEl = document.getElementById('rouletteResult');

  spinBtn.disabled = true;
  allBtns.forEach(b => b.disabled = true);
  numberEl.classList.remove('red', 'black', 'green');
  numberEl.classList.add('rolling');
  numberEl.textContent = '?';
  badge.className = 'roulette-color-badge';
  badge.textContent = 'Dreht...';
  hint.textContent = '';
  resultEl.textContent = '';

  const res = await fetch('/api/roulette', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ bet_type: rouletteBet.type, bet_value: rouletteBet.value })
  });
  const data = await res.json();

  if (data.error) {
    resultEl.textContent = '⚠️ ' + data.error;
    numberEl.classList.remove('rolling');
    rouletteSpinning = false;
    spinBtn.disabled = false;
    allBtns.forEach(b => b.disabled = false);
    return;
  }

  // Rollier-Animation: 20 zufällige Zahlen
  let counter = 0;
  const rollInterval = setInterval(() => {
    const rand = Math.floor(Math.random() * 37);
    numberEl.textContent = rand;
    counter++;
    if (counter >= 20) {
      clearInterval(rollInterval);
      numberEl.classList.remove('rolling');
      numberEl.classList.add(data.color);
      numberEl.textContent = data.number;
      badge.className = 'roulette-color-badge ' + data.color;
      badge.textContent = data.color === 'red' ? 'Rot' : data.color === 'black' ? 'Schwarz' : 'Grün';

      resultEl.innerHTML = data.win
        ? `<span class="win">🎉 Gewonnen! (${data.payout}:1)</span>`
        : `<span class="lose">😢 Verloren</span>`;

      hint.textContent = 'Wähle eine neue Wette';

      rouletteSpinning = false;
      spinBtn.disabled = false;
      allBtns.forEach(b => b.disabled = false);

      // Auswahl zurücksetzen
      allBtns.forEach(b => b.classList.remove('selected'));
      rouletteBet = null;
      spinBtn.disabled = true;
    }
  }, 80);
}

/* ============ Init ============ */
renderWheel();
setupRouletteButtons();
</script>
